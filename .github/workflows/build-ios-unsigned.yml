name: Build iOS IPA unsigned

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS folder if missing
        run: |
          if [ ! -d "qned_remote/ios" ]; then
            flutter create --platforms=ios --org com.jeancarlos qned_remote_tmp
            cp -R qned_remote_tmp/ios qned_remote/
            rm -rf qned_remote_tmp
          fi

      - name: Install dependencies
        working-directory: qned_remote
        run: flutter pub get

      - name: Prepare Flutter iOS build files
        working-directory: qned_remote
        run: flutter build ios --release --no-codesign --config-only

      - name: Compile Xcode project forcing no code sign
        working-directory: qned_remote/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build_xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        working-directory: qned_remote
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build_xcode/Build/Products/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r qned_remote.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: qned-remote-ios-unsigned
          path: qned_remote/build/ios/ipa/qned_remote.ipa
          if-no-files-found: error
          retention-days: 7
